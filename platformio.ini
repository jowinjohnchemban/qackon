; Qackon Beacon — PlatformIO project file
; Board: ESP32-WROOM-32

[env:qackon]
platform = espressif32
board = esp32dev
framework = arduino

; Use LittleFS for the web UI + config storage
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D QACKON_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    ESP32Async/ESPAsyncWebServer @ ^3.3.0
    ESP32Async/AsyncTCP @ ^3.2.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    vshymanskyy/TinyGSM @ ^0.12.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Split partitions to leave room for OTA + LittleFS
board_build.partitions = default.csv
